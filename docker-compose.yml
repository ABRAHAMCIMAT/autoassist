services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autoassist
      POSTGRES_USER: autoassist
      POSTGRES_PASSWORD: autoassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://autoassist:autoassist@db:5432/autoassist
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ESCALATION_THRESHOLD: ${ESCALATION_THRESHOLD:-0.72}
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
